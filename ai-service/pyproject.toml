[project]
name = "ai-service"
version = "0.1.0"
description = "AutopilotFocus AI service: content facts, embeddings, goal match, LLM judge"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
