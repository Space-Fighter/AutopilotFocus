<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Board</title>
<style>html, body, #app { margin: 0; height: 100%; background: #fff; }</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
  // ?file=board.excalidraw  &frame=3 (zoom to the frame named "3 · …")  &ui=0 (hide toolbar)
  const params = new URLSearchParams(location.search);
  const file = params.get("file") || "board.excalidraw";
  const frameNo = params.get("frame");
  fetch(file).then(r => r.json()).then(data => {
    const fit = (api) => {
      if (!api) return;
      setTimeout(() => {
        let targets = api.getSceneElements();
        if (frameNo) {
          const f = targets.find(e => e.type === "frame" && (e.name || "").startsWith(frameNo + " "));
          if (f) targets = [f];
        }
        api.scrollToContent(targets, { fitToContent: true });
        document.title = "ready";
      }, 400);
    };
    const App = () => React.createElement(ExcalidrawLib.Excalidraw, {
      initialData: { elements: data.elements, appState: { ...data.appState, zenModeEnabled: params.get("ui") === "0" }, files: data.files },
      excalidrawAPI: fit,
    });
    ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
  });
</script>
</body>
</html>
