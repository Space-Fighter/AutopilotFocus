# sqlc: generates Go code from SQL. Schema = the shared migrations; queries = internal/db/queries.
# Regenerate from api/ (see api/README.md):
#   docker run --rm -v "$PWD/..:/src" -w /src/api sqlc/sqlc:1.30.0 generate
version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        overrides:
          # pgvector's import path has a dash, so the Go package name is given explicitly.
          - db_type: vector
            go_type: { import: "github.com/pgvector/pgvector-go", package: "pgvector", type: "Vector", pointer: true }
            nullable: true
          - db_type: vector
            go_type: { import: "github.com/pgvector/pgvector-go", package: "pgvector", type: "Vector" }
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            go_type: github.com/google/uuid.NullUUID
            nullable: true
